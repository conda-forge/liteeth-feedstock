schema_version: 1

context:
  name: liteeth
  version: "2026.04"
  sha256: 4a2ef0bc04c55698da6c9dd73bcefdab5a3422df9692ddb6f106de5e50b0c614

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/enjoy-digital/${{ name }}/archive/refs/tags/${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ version }}.tar.gz

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-build-isolation --no-deps
  python:
    entry_points:
      - liteeth_gen = liteeth.gen:main

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - litex ~=${{ version }}*
    - liteiclink ~=${{ version }}*
    - packaging
    - pyyaml

tests:
  - python:
      imports:
        - liteeth
      pip_check: false
      python_version:
        - ${{ python_min }}
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}
    script:
      - liteeth_gen --help

about:
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Small footprint and configurable Ethernet core
  description: Small footprint and configurable Ethernet core
  homepage: https://github.com/enjoy-digital/liteeth
  repository: https://github.com/enjoy-digital/liteeth

extra:
  recipe-maintainers:
    - enjoy-digital
    - timkpaine
